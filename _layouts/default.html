<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap" rel="stylesheet">
	<title>{% if page.title %}{{ page.title }}{% else %}Midjourney Storytelling Lab{% endif %}</title>
	<link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
	<style>
	* { box-sizing: border-box; margin: 0; padding: 0; }
	body {
    font-family: monospace; font-size: 18px; line-height: 1.5;
    margin: 0; padding: 0;
    background-color: #FDF9F3; 
}
	h1, h2 { margin-bottom: 1rem; }
	a { color: var(--primary-color); }
	h1 a { color: inherit; text-decoration: none; }
	section { margin-bottom: 2rem; }
	ul { margin-left: 1rem; }
	li { margin-bottom: 0.5rem; }
	/* people */
	.people { display: flex; flex-flow: row wrap; gap: 1rem 0; }
	.person { width: 50%; display: flex; align-items: center; padding-right: 1rem; }
	@media (max-width: 500px) { .person { width: 100%; } }
	.person .name { font-weight: bold; font-size: 1.25rem; }
	.person .name a, .person-name { color: inherit; text-decoration: none; }
	.person .portrait {
		width: 25%; margin-right: 5%; aspect-ratio: 1/1; border-radius: 100%;
		background-size: cover; background-position-y: center;
	}
	.person .info { width: 70%; }
	/* pubs */
	.pub .title { font-weight: bold; }
  iframe{
    border: none;
  }
  .button{
    border: solid 2px black;
    padding: 5px 10px;
    border-radius: 5px;
    color: black;
    text-decoration: none;
  }
  .bibbox{
    padding: 20px;
    border-radius: 10px;
    background-color: #f0f0f0;
  }
  .cursor {
    display: inline-block;
    animation: blink 1s step-end infinite;
    color: #2952a3;
  }
  
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
	</style>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>
	{% if page.layout != "project" %}
	<div class="first-screen">
		<div class="powered-by">
			<a href="https://www.midjourney.com/">Powered by Midjourney</a>
		</div>
		<div id="container">
			<div id="cloud-container"></div>
			<div id="ocean">
				<div id="wave-container">
					<div id="ascii-ocean"></div>
				</div>
			</div>
		</div>

		<div class="content-overlay">
			<div class="header">
				<div class="title-section">
					<h1 class="main-title">Midjourney Storytelling Lab</h1>
					<p class="subtitle"><span id="typing-text"></span><span class="cursor">_</span></p>
				</div>

				<div class="image-section">
					<div class="message-box">
						<p></p>
						<div class="buttons">
						</div>
					</div>
					<div class="boat-container">
						<img src="{{ '/img/website/boat_patchwork.png' | relative_url }}" alt="sailing boat" class="boat-image">
					</div>
				</div>
			</div>
		</div>
	</div>
	{% endif %}
	
	<div class="content-sections">
		{{ content }}
		

		<footer class="site-footer">
			<p><a href="https://www.midjourney.com/">Powered by Midjourney</a></p>
		</footer>
	</div>


	<script src="{{ '/assets/js/cloud-effect.js' | relative_url }}"></script>
	<script src="{{ '/assets/js/ocean-config.js' | relative_url }}"></script>
	<script src="{{ '/assets/js/ocean-effect.js' | relative_url }}"></script>
	<script src="{{ '/assets/js/story-engine.js' | relative_url }}"></script>
	<script type="module">
		window.addEventListener('DOMContentLoaded', () => {
			{% if page.layout != "project" %}
			const asciiOceanElement = document.getElementById('ascii-ocean');

			// ascii ocean effect
			if (asciiOceanElement) {
				const oceanEffect = new ASCIIOcean(asciiOceanElement);
				initGUI();
			} else {
				console.error('cannot find ascii-ocean element');
			}
			
			// scroll parallax effect
			const firstScreen = document.querySelector('.first-screen');
			const container = document.getElementById('container');
			const ocean = document.getElementById('ocean');
			const clouds = document.getElementById('cloud-container');
			const boat = document.querySelector('.boat-container');
			const imageSection = document.querySelector('.image-section');
			
			// store initial position information
			const initialPositions = {
				boatBottom: boat ? boat.getBoundingClientRect().bottom : 0,
				oceanTop: ocean ? ocean.getBoundingClientRect().top : 0
			};
			
			window.addEventListener('scroll', () => {
				// ensure elements exist
				if (firstScreen && container) {
					// get scroll position
					const scrollY = window.scrollY;
					
					// if still in the first screen, apply parallax effect
					if (scrollY <= firstScreen.offsetHeight) {
						// movement rate
						const oceanRate = 0.3;
						const cloudRate = 0.5;
						const containerRate = 0.1;
						const imgSecRate = 1.2;
						
						// ocean and boat move together, using the same rate
						if (ocean) {
							ocean.style.transform = `translateY(${scrollY * oceanRate}px)`;
						}
						
						if (boat) {
							const windowWidth = window.innerWidth;
							var scale = windowWidth/1300*imgSecRate<0.7?0.7:windowWidth/1300*imgSecRate;
							scale = scale>1?1:scale;

							imageSection.style.transform = `translateY(${scrollY * oceanRate}px) scale(${scale})`;
						}
						
						// clouds move faster
						if (clouds) {
							clouds.style.transform = `translateY(${scrollY * cloudRate}px)`;
						}
						
						// container moves slightly
						container.style.transform = `translateY(${scrollY * containerRate}px)`;
					}
				}
			});

			// typing effect
			const text = "Building expressive, approachable, and controllable tools for AI-supported storytelling";
			const typingTextElement = document.getElementById('typing-text');
			let charIndex = 0;
			const typingSpeed = 20; // milliseconds per character
			
			function typeText() {
				if (charIndex < text.length) {
					typingTextElement.textContent += text.charAt(charIndex);
					charIndex++;
					setTimeout(typeText, typingSpeed);
				}
			}
			
			// start typing effect
			typeText();

			// adjust element size
			function adjustElementSize(){
				const windowWidth = window.innerWidth
				const imageSection = document.querySelector('.image-section');
				const titleSection = document.querySelector('.title-section');
				const scrollY = window.scrollY;
				const oceanRate = 0.3;
				const imgSecRate = 1.2;
				if(windowWidth < 1300){
					if(imageSection){
						console.log('adjust...')
						var scale = windowWidth/1300*1.2<0.7?0.7:windowWidth/1300*imgSecRate;
						scale = scale>1?1:scale;
						imageSection.style.transform = `translateY(${scrollY * oceanRate}px) scale(${scale})`;
						titleSection.style.transform = `scale(${windowWidth/1300<0.6?0.6:windowWidth/1300})`;
					}
				}else{
					if(imageSection){
						imageSection.style.transform = `translateY(${scrollY * oceanRate}px)`;
						titleSection.style.transform = `scale(1)`;
					}
				}
			}
			adjustElementSize();
			window.addEventListener('resize', adjustElementSize);
			{% endif %}
		});
	</script>
</body>
</html>
